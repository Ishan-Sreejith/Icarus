<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Icarus Playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f6f4ef;
        --panel: #ffffff;
        --panel-2: #f1eee7;
        --ink: #151515;
        --muted: #5a5a5a;
        --accent: #1f7a6b;
        --danger: #c44b4b;
        --border: rgba(21, 21, 21, 0.12);
        --shadow: 0 18px 40px rgba(15, 13, 10, 0.08);
        --radius: 14px;
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        --body: "Space Grotesk", system-ui, sans-serif;
      }

      [data-theme="dark"] {
        --bg: #0f1215;
        --panel: #151a20;
        --panel-2: #1c222b;
        --ink: #f2f2f2;
        --muted: #b4b4b4;
        --accent: #4ec6b4;
        --danger: #e07a7a;
        --border: rgba(240, 240, 240, 0.12);
        --shadow: 0 22px 50px rgba(0, 0, 0, 0.45);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: var(--body);
        color: var(--ink);
        background: var(--bg);
      }

      .app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        gap: 18px;
        padding: 20px clamp(18px, 4vw, 36px) 28px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 16px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }

      .brand {
        font-weight: 600;
        letter-spacing: 0.4px;
      }

      .status {
        font-size: 12px;
        color: var(--muted);
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--panel-2);
        border: 1px solid var(--border);
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      label {
        font-size: 12px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      select,
      input,
      textarea,
      button {
        font-family: var(--body);
      }

      select,
      input,
      textarea {
        border-radius: 10px;
        border: 1px solid var(--border);
        padding: 8px 10px;
        background: var(--panel-2);
        color: var(--ink);
      }

      textarea {
        width: 100%;
        min-height: 320px;
        resize: vertical;
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.6;
      }

      .btn {
        border-radius: 999px;
        padding: 8px 14px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--ink);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }

      .btn.primary {
        background: var(--accent);
        border-color: transparent;
        color: #fff;
      }

      .btn.danger {
        background: var(--danger);
        border-color: transparent;
        color: #fff;
      }

      .workspace {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
        gap: 18px;
        min-height: 0;
      }

      .column {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-height: 0;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        min-height: 0;
      }

      .panel-header {
        padding: 12px 14px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }

      .panel-title {
        font-weight: 600;
      }

      .panel-body {
        padding: 12px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        min-height: 0;
      }

      .file-controls {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }

      .file-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow: auto;
        max-height: 220px;
      }

      .file-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        border: 1px solid transparent;
        background: var(--panel-2);
        cursor: pointer;
      }

      .file-item.active {
        border-color: var(--accent);
        background: rgba(31, 122, 107, 0.12);
      }

      .file-actions {
        display: flex;
        gap: 6px;
      }

      .file-actions button {
        padding: 4px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--panel);
        font-size: 11px;
        cursor: pointer;
      }

      .terminal {
        background: #0f1216;
        color: #d6f5de;
        border-radius: 12px;
        padding: 12px;
        font-family: var(--mono);
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 180px;
      }

      [data-theme="dark"] .terminal {
        background: #0b0e12;
      }

      .terminal-log {
        flex: 1;
        overflow-y: auto;
        font-size: 12px;
      }

      .terminal-line.error {
        color: #ffb3a7;
      }

      .terminal-input {
        background: #0b0e12;
        color: #d6f5de;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 8px;
        padding: 8px 10px;
        font-family: var(--mono);
        font-size: 12px;
      }

      .editor-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .file-meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .pill {
        font-size: 11px;
        color: var(--muted);
        padding: 3px 8px;
        border-radius: 999px;
        background: var(--panel-2);
        border: 1px solid var(--border);
        width: fit-content;
      }

      .output {
        background: var(--panel-2);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        font-family: var(--mono);
        font-size: 12px;
        min-height: 140px;
        white-space: pre-wrap;
      }

      .output.flash {
        animation: flash 0.5s ease;
      }

      .test-log {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--muted);
      }

      .test-line.pass {
        color: var(--accent);
      }

      .test-line.fail {
        color: var(--danger);
      }

      @keyframes flash {
        from {
          box-shadow: 0 0 0 0 rgba(31, 122, 107, 0.5);
        }
        to {
          box-shadow: 0 0 0 12px rgba(31, 122, 107, 0);
        }
      }

      @media (max-width: 980px) {
        .workspace {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-theme="light">
    <div class="app">
      <header class="topbar">
        <div class="brand">Icarus Playground</div>
        <div class="status" id="engineStatus">Engine: loading</div>
        <div class="controls">
          <label>
            Engine
            <select id="engineSelect">
              <option value="js">JavaScript</option>
              <option value="wasm">WebAssembly</option>
            </select>
          </label>
          <label>
            Font
            <select id="fontSizeSelect">
              <option value="13">13px</option>
              <option value="14" selected>14px</option>
              <option value="15">15px</option>
              <option value="16">16px</option>
            </select>
          </label>
          <button class="btn" id="themeToggle">Theme</button>
        </div>
      </header>

      <main class="workspace">
        <section class="column">
          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">Files</div>
              <div class="pill" id="fileCountLabel">0 files</div>
            </div>
            <div class="panel-body">
              <div class="file-controls">
                <input type="text" id="newFileName" placeholder="new_file.fr" />
                <button class="btn primary" id="createFileBtn">Create</button>
              </div>
              <div class="file-list" id="fileList"></div>
              <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                <button class="btn" id="refreshFilesBtn">Refresh</button>
                <button class="btn" id="resetFilesBtn">Reset Samples</button>
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">Terminal</div>
              <div class="pill">mock shell</div>
            </div>
            <div class="panel-body">
              <div class="terminal">
                <div class="terminal-log" id="terminalLog"></div>
                <input
                  type="text"
                  class="terminal-input"
                  id="terminalInput"
                  placeholder="Type a command, press Enter"
                />
              </div>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">Feature Tests</div>
              <div class="pill" id="engineLabel">Engine: JS</div>
            </div>
            <div class="panel-body">
              <button class="btn primary" id="runTestsBtn">Run all tests</button>
              <div class="test-log" id="testLog">No tests run yet.</div>
            </div>
          </div>
        </section>

        <section class="column">
          <div class="panel" style="flex: 1;">
            <div class="panel-header">
              <div class="panel-title">Editor</div>
              <div class="pill" id="fileDirtyLabel">Saved</div>
            </div>
            <div class="panel-body" style="flex: 1;">
              <div class="editor-toolbar">
                <div class="file-meta">
                  <div class="panel-title" id="currentFileLabel">No file selected</div>
                  <div class="pill">Ctrl/Cmd + Enter to run</div>
                </div>
                <div style="display: flex; gap: 8px;">
                  <button class="btn" id="saveBtn">Save</button>
                  <button class="btn primary" id="runBtn">Run</button>
                </div>
              </div>
              <textarea id="codeEditor" spellcheck="false"></textarea>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <div class="panel-title">Output</div>
              <div class="pill">program output</div>
            </div>
            <div class="panel-body">
              <div class="output" id="runOutput">Run a file to see output.</div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module">
      import { CoReJsEngine } from "./js/core_js_engine.js";

      const fileList = document.getElementById("fileList");
      const editor = document.getElementById("codeEditor");
      const output = document.getElementById("runOutput");
      const currentFileLabel = document.getElementById("currentFileLabel");
      const fileDirtyLabel = document.getElementById("fileDirtyLabel");
      const engineStatus = document.getElementById("engineStatus");
      const engineLabel = document.getElementById("engineLabel");
      const terminalLog = document.getElementById("terminalLog");
      const terminalInput = document.getElementById("terminalInput");
      const fileCountLabel = document.getElementById("fileCountLabel");
      const engineSelect = document.getElementById("engineSelect");
      const fontSizeSelect = document.getElementById("fontSizeSelect");
      const testLog = document.getElementById("testLog");
      const themeToggle = document.getElementById("themeToggle");

      const jsEngine = new CoReJsEngine();
      let wasmCompiler = null;
      let wasmReady = false;

      const STORAGE_FILES = "icarus_demo_files_v1";
      const STORAGE_CURRENT = "icarus_demo_current_v1";
      const STORAGE_SETTINGS = "icarus_demo_settings_v1";

      const files = new Map();
      let currentFile = null;
      let dirty = false;

      const settings = {
        theme: "light",
        fontSize: 14,
        engine: "js",
      };

      const testCases = [
        { name: "Core smoke test", file: "test_all.fr", expect: "All tests done." },
        { name: "Feature showcase", file: "feature_showcase.fr", expect: "Feature Test Complete" },
      ];

      function logTerminal(message, kind = "info") {
        const line = document.createElement("div");
        line.className = `terminal-line${kind === "error" ? " error" : ""}`;
        line.textContent = message;
        terminalLog.appendChild(line);
        terminalLog.scrollTop = terminalLog.scrollHeight;
      }

      function setStatus() {
        const wasmText = wasmReady ? "WASM ready" : "WASM not ready";
        engineStatus.textContent = `Engine: ${wasmText}`;
        engineLabel.textContent = `Engine: ${settings.engine.toUpperCase()}`;
      }

      function applySettings() {
        document.body.setAttribute("data-theme", settings.theme);
        editor.style.fontSize = `${settings.fontSize}px`;
        engineSelect.value = settings.engine;
        fontSizeSelect.value = String(settings.fontSize);
      }

      function saveSettings() {
        localStorage.setItem(STORAGE_SETTINGS, JSON.stringify(settings));
      }

      function loadSettings() {
        const stored = localStorage.getItem(STORAGE_SETTINGS);
        if (!stored) return;
        try {
          const parsed = JSON.parse(stored);
          if (parsed.theme) settings.theme = parsed.theme;
          if (parsed.fontSize) settings.fontSize = parsed.fontSize;
          if (parsed.engine) settings.engine = parsed.engine;
        } catch {
          return;
        }
      }

      function updateDirtyState(isDirty) {
        dirty = isDirty;
        fileDirtyLabel.textContent = dirty ? "Unsaved" : "Saved";
      }

      function listFiles() {
        const names = Array.from(files.keys()).sort();
        fileList.innerHTML = "";
        fileCountLabel.textContent = `${names.length} files`;

        if (names.length === 0) {
          const empty = document.createElement("div");
          empty.textContent = "No files yet.";
          empty.className = "pill";
          fileList.appendChild(empty);
          return;
        }

        for (const name of names) {
          const row = document.createElement("div");
          row.className = "file-item" + (name === currentFile ? " active" : "");

          const label = document.createElement("div");
          label.textContent = name;
          label.style.flex = "1";
          label.onclick = () => openFile(name);

          const actions = document.createElement("div");
          actions.className = "file-actions";

          const renameBtn = document.createElement("button");
          renameBtn.textContent = "Rename";
          renameBtn.onclick = (e) => {
            e.stopPropagation();
            renameFile(name);
          };

          const deleteBtn = document.createElement("button");
          deleteBtn.textContent = "Delete";
          deleteBtn.onclick = (e) => {
            e.stopPropagation();
            deleteFile(name);
          };

          actions.append(renameBtn, deleteBtn);
          row.append(label, actions);
          fileList.appendChild(row);
        }
      }

      function syncToWasm(name) {
        if (!wasmReady) return;
        wasmCompiler.save_file(name, files.get(name) || "");
      }

      function syncAllToWasm() {
        if (!wasmReady) return;
        for (const [name, content] of files.entries()) {
          wasmCompiler.save_file(name, content);
        }
      }

      function openFile(name) {
        if (!files.has(name)) return;
        currentFile = name;
        editor.value = files.get(name);
        currentFileLabel.textContent = name;
        updateDirtyState(false);
        listFiles();
        persistFiles();
      }

      function validateFileName(name) {
        if (!name) return "File name required.";
        if (!name.endsWith(".fr")) return "Files must end with .fr";
        return "";
      }

      function createFile(name, content) {
        const error = validateFileName(name);
        if (error) {
          alert(error);
          return;
        }
        if (files.has(name)) {
          alert("File already exists.");
          return;
        }
        files.set(name, content || "");
        syncToWasm(name);
        listFiles();
        openFile(name);
        persistFiles();
      }

      function renameFile(oldName, forcedName) {
        const newName = forcedName || prompt("Rename file to:", oldName);
        if (!newName || newName === oldName) return;
        const error = validateFileName(newName);
        if (error) {
          alert(error);
          return;
        }
        if (files.has(newName)) {
          alert("File already exists.");
          return;
        }
        const content = files.get(oldName) || "";
        files.delete(oldName);
        files.set(newName, content);
        if (wasmReady) {
          wasmCompiler.delete_file(oldName);
          wasmCompiler.save_file(newName, content);
        }
        if (currentFile === oldName) {
          currentFile = newName;
          currentFileLabel.textContent = newName;
        }
        listFiles();
        persistFiles();
      }

      function deleteFile(name) {
        if (!confirm(`Delete ${name}?`)) return;
        files.delete(name);
        if (wasmReady) wasmCompiler.delete_file(name);
        if (currentFile === name) {
          currentFile = null;
          editor.value = "";
          currentFileLabel.textContent = "No file selected";
          updateDirtyState(false);
        }
        listFiles();
        persistFiles();
      }

      function saveCurrent() {
        if (!currentFile) {
          alert("No file selected.");
          return;
        }
        files.set(currentFile, editor.value);
        syncToWasm(currentFile);
        updateDirtyState(false);
        listFiles();
        persistFiles();
      }

      function pickEngine() {
        if (settings.engine === "wasm" && wasmReady) return "wasm";
        if (settings.engine === "wasm" && !wasmReady) {
          logTerminal("WASM engine not ready. Falling back to JS.", "error");
        }
        return "js";
      }

      function runFile(name, silent = false) {
        if (!name || !files.has(name)) {
          if (!silent) output.textContent = "File not found.";
          return { ok: false, output: "File not found." };
        }
        if (!silent && name === currentFile) saveCurrent();
        const engine = pickEngine();
        try {
          const result =
            engine === "wasm"
              ? wasmCompiler.execute(name)
              : jsEngine.execute(files.get(name) || "");
          const text = result || "Program executed successfully";
          if (!silent) {
            output.textContent = text;
            output.classList.remove("flash");
            void output.offsetWidth;
            output.classList.add("flash");
          }
          return { ok: true, output: text };
        } catch (err) {
          const message = `Error: ${err.message}`;
          if (!silent) {
            output.textContent = message;
            output.classList.remove("flash");
            void output.offsetWidth;
            output.classList.add("flash");
          }
          return { ok: false, output: message };
        }
      }

      async function runFeatureTests() {
        testLog.innerHTML = "";
        const summary = [];
        for (const test of testCases) {
          const line = document.createElement("div");
          line.className = "test-line";
          line.textContent = `${test.name} ...`;
          testLog.appendChild(line);
          const res = runFile(test.file, true);
          const ok = res.ok && (!test.expect || res.output.includes(test.expect));
          line.className = `test-line ${ok ? "pass" : "fail"}`;
          line.textContent = `${test.name} ${ok ? "passed" : "failed"}`;
          summary.push(ok);
        }
        if (summary.every(Boolean)) {
          logTerminal("All feature tests passed.");
        } else {
          logTerminal("Some feature tests failed. Check the test panel.", "error");
        }
      }

      function handleCommand(input) {
        const trimmed = input.trim();
        if (!trimmed) return;
        logTerminal(`$ ${trimmed}`);
        const parts = trimmed.split(/\s+/);
        const cmd = parts[0];
        const args = parts.slice(1);

        if (cmd === "clear") {
          terminalLog.innerHTML = "";
          return;
        }

        if (cmd === "help") {
          logTerminal("Commands: help, ls, cat <file>, open <file>, run <file>, touch <file>, rm <file>, mv <old> <new>, tests, clear, core, metroman");
          return;
        }

        if (cmd === "tests") {
          runFeatureTests();
          logTerminal("Running feature tests...");
          return;
        }

        if (cmd === "ls") {
          logTerminal(Array.from(files.keys()).sort().join("  ") || "(no files)");
          return;
        }

        if (cmd === "cat") {
          const name = args[0];
          if (!name || !files.has(name)) {
            logTerminal("File not found.", "error");
            return;
          }
          logTerminal(files.get(name));
          return;
        }

        if (cmd === "open") {
          const name = args[0];
          if (!name || !files.has(name)) {
            logTerminal("File not found.", "error");
            return;
          }
          openFile(name);
          return;
        }

        if (cmd === "touch") {
          const name = args[0];
          if (!name) {
            logTerminal("Usage: touch <file>", "error");
            return;
          }
          createFile(name, "");
          return;
        }

        if (cmd === "rm") {
          const name = args[0];
          if (!name || !files.has(name)) {
            logTerminal("File not found.", "error");
            return;
          }
          deleteFile(name);
          logTerminal(`Deleted ${name}`);
          return;
        }

        if (cmd === "mv") {
          const [oldName, newName] = args;
          if (!oldName || !newName) {
            logTerminal("Usage: mv <old> <new>", "error");
            return;
          }
          if (!files.has(oldName)) {
            logTerminal("File not found.", "error");
            return;
          }
          if (files.has(newName)) {
            logTerminal("Target file already exists.", "error");
            return;
          }
          renameFile(oldName, newName);
          logTerminal(`Renamed ${oldName} -> ${newName}`);
          return;
        }

        if (cmd === "run") {
          const name = args[0] || currentFile;
          if (!name || !files.has(name)) {
            logTerminal("File not found.", "error");
            return;
          }
          runFile(name);
          logTerminal(`Executed ${name}.`);
          return;
        }

        if (cmd === "core" || cmd === "metroman") {
          if (!wasmReady) {
            logTerminal("WASM engine not available. Command requires WASM.", "error");
            return;
          }
          syncAllToWasm();
          const res = wasmCompiler.execute_command(trimmed);
          logTerminal(res || "(no output)");
          return;
        }

        logTerminal("Unknown command. Type help.", "error");
      }

      function persistFiles() {
        localStorage.setItem(STORAGE_FILES, JSON.stringify(Array.from(files.entries())));
        if (currentFile) localStorage.setItem(STORAGE_CURRENT, currentFile);
      }

      function loadStoredFiles() {
        const raw = localStorage.getItem(STORAGE_FILES);
        if (!raw) return false;
        try {
          const entries = JSON.parse(raw);
          files.clear();
          for (const [name, content] of entries) {
            files.set(name, content || "");
          }
          const savedCurrent = localStorage.getItem(STORAGE_CURRENT);
          if (savedCurrent && files.has(savedCurrent)) {
            currentFile = savedCurrent;
          }
          return files.size > 0;
        } catch {
          return false;
        }
      }

      async function loadSamples() {
        const samples = [
          { name: "main.fr", path: "./main.fr", fallback: jsEngine.get_sample_code() },
          { name: "feature_showcase.fr", path: "./feature_showcase.fr", fallback: "say: \"Icarus showcase\"" },
          { name: "test_all.fr", path: "./vm/test_all.fr", fallback: "say: \"Testing...\"\nsay: \"All tests done.\"" },
        ];
        for (const sample of samples) {
          let content = sample.fallback;
          try {
            const res = await fetch(sample.path);
            if (res.ok) content = await res.text();
          } catch {
            content = sample.fallback;
          }
          files.set(sample.name, content.trim() + "\n");
        }
      }

      async function initWasm() {
        try {
          const mod = await import("./wasm/pkg/core_wasm.js");
          await mod.default();
          wasmCompiler = new mod.CoreCompilerWasm();
          wasmReady = true;
          syncAllToWasm();
          setStatus();
        } catch (err) {
          wasmReady = false;
          setStatus();
          logTerminal(`WASM init failed: ${err.message}`, "error");
        }
      }

      document.getElementById("createFileBtn").onclick = () => {
        const input = document.getElementById("newFileName");
        createFile(input.value.trim(), "");
        input.value = "";
      };

      document.getElementById("refreshFilesBtn").onclick = () => listFiles();
      document.getElementById("resetFilesBtn").onclick = async () => {
        files.clear();
        localStorage.removeItem(STORAGE_FILES);
        localStorage.removeItem(STORAGE_CURRENT);
        await loadSamples();
        if (!currentFile && files.size > 0) {
          openFile(Array.from(files.keys()).sort()[0]);
        }
        syncAllToWasm();
        listFiles();
        logTerminal("Sample files restored.");
      };

      document.getElementById("saveBtn").onclick = saveCurrent;
      document.getElementById("runBtn").onclick = () => runFile(currentFile);
      document.getElementById("runTestsBtn").onclick = runFeatureTests;

      terminalInput.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          handleCommand(terminalInput.value);
          terminalInput.value = "";
        }
      });

      editor.addEventListener("input", () => updateDirtyState(true));

      fontSizeSelect.addEventListener("change", () => {
        settings.fontSize = Number(fontSizeSelect.value);
        applySettings();
        saveSettings();
      });

      engineSelect.addEventListener("change", () => {
        settings.engine = engineSelect.value;
        setStatus();
        saveSettings();
      });

      themeToggle.addEventListener("click", () => {
        settings.theme = settings.theme === "light" ? "dark" : "light";
        applySettings();
        saveSettings();
      });

      window.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
          runFile(currentFile);
        }
      });

      async function bootstrap() {
        loadSettings();
        applySettings();
        if (!loadStoredFiles()) {
          await loadSamples();
        }
        listFiles();
        const initial = currentFile || Array.from(files.keys()).sort()[0];
        if (initial) openFile(initial);
        logTerminal("Icarus demo ready. Type help for commands.");
        setStatus();
        initWasm();
      }

      bootstrap();
    </script>
  </body>
</html>
